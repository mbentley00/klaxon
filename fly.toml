# fly.toml app configuration file generated for buzz-online-mjb on 2026-06-16T16:34:09-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'klaxon-buzz'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

# Durable storage for MODAQ-mode artifacts (rosters, round packets, exported
# match QBJ, errata). The realtime buzzer core stays in-memory; only these
# tournament records are persisted here so they survive restarts/redeploys.
[env]
  KLAXON_DATA_DIR = '/data'

[[mounts]]
  source = 'klaxon_data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '15s'
    timeout = '3s'
    path = '/healthz'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
