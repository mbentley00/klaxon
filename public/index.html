<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f3efe6" />
  <link rel="icon" href="/favicon.ico?v=2" sizes="48x48" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=2" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
  <title>Klaxon — online quizbowl buzzing system</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="landing">
  <main class="card">
    <h1 class="wordmark">Klaxon</h1>
    <p class="tag">An online quizbowl buzzing system.</p>

    <section>
      <h2>Join a room</h2>
      <form id="join-form" class="row">
        <input id="join-code" inputmode="text" autocapitalize="characters"
               maxlength="5" placeholder="ROOM CODE" aria-label="Room code" />
        <input id="join-name" placeholder="Your name" aria-label="Your name" />
        <button type="submit">Join</button>
      </form>
    </section>

    <section>
      <h2>Create a room</h2>
      <form id="create-room" class="stack">
        <button type="submit" class="primary">Create room &amp; read</button>
      </form>
    </section>

    <nav class="modes" aria-label="Other modes">
      <a class="btnlink ghost" href="/advanced">Advanced mode →</a>
      <a class="btnlink ghost" href="/tournament-mode">Tournament mode →</a>
    </nav>

    <p id="msg" class="msg" role="status"></p>
  </main>

  <footer class="site-foot">
    <a href="/about">About</a>
  </footer>
  <script type="module" src="/js/landing.js"></script>
</body>
</html>
