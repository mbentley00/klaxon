<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f3efe6" />
  <link rel="icon" href="/favicon.ico?v=2" sizes="48x48" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=2" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
  <title>Packet parser — Klaxon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="room">
  <header class="bar">
    <nav class="bar-left crumbs" aria-label="Breadcrumb">
      <a class="crumb crumb-mark" href="/">Klaxon</a>
      <span class="crumb-sep">›</span>
      <span class="crumb" aria-current="page">Packet parser</span>
    </nav>
  </header>

  <main class="stage">
    <section class="panel">
      <h3>Packet parser</h3>
      <p class="hint">Turn a Word packet into the JSON a reader can load. Drop in a
        <code>.docx</code>, or a <code>.zip</code> of them for a whole set. Nothing is stored —
        the file is parsed and handed straight back to you.</p>

      <label class="select-label" for="yapp-file">Packet file</label>
      <input type="file" id="yapp-file" accept=".docx,.zip,application/zip" />
      <p class="hint" id="yapp-file-note"></p>
    </section>

    <section class="panel">
      <h3>Output</h3>
      <label class="select-label" for="yapp-format">Format</label>
      <select id="yapp-format">
        <option value="json">JSON — what MODAQ and Klaxon read</option>
        <option value="yapp2">yapp2 JSON — adds pronunciation-guide anchors</option>
        <option value="html">HTML — a packet to read on screen</option>
      </select>
      <p class="hint" id="yapp-format-note"></p>
      <label class="toggle"><input type="checkbox" id="yapp-pretty" checked /> Pretty-print it
        (easier to read and diff; the file is bigger)</label>
      <label class="toggle" id="yapp-merge-row"><input type="checkbox" id="yapp-merge" /> Zip files:
        merge every packet into one file instead of a zip of separate ones</label>
    </section>

    <section class="panel">
      <div class="row">
        <button id="yapp-parse" class="primary" disabled>Parse packet</button>
        <span class="hint" id="yapp-status"></span>
      </div>
      <p id="yapp-msg" class="msg"></p>

      <!-- Per-file failures from a zip: the rest of the set still converted. -->
      <div id="yapp-errors" class="roster-alerts hidden">
        <h5>Packets that didn't parse <span id="yapp-errors-count" class="muted-count"></span></h5>
        <ul id="yapp-errors-list"></ul>
      </div>
    </section>

    <section class="panel hidden" id="yapp-result-panel">
      <h3>Result <span id="yapp-result-meta" class="muted-count"></span></h3>
      <div class="row">
        <button id="yapp-download" class="primary">Download</button>
        <button id="yapp-copy" class="ghost">Copy</button>
      </div>
      <p class="hint" id="yapp-preview-note"></p>
      <pre id="yapp-preview" class="yapp-preview"></pre>
    </section>
  </main>

  <script type="module" src="/js/yapp.js"></script>
</body>
</html>
