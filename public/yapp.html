<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f3efe6" />
  <script src="/js/theme.js"></script>
  <link rel="icon" href="/favicon.ico?v=2" sizes="48x48" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=2" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
  <title>Packet parser — Klaxon</title>
  <link rel="preload" href="/fonts/bricolage-800.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/css/fonts.css" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="room">
  <header class="bar">
    <nav class="bar-left crumbs" aria-label="Breadcrumb">
      <a class="crumb crumb-mark" href="/">Klaxon</a>
      <span class="crumb-sep">›</span>
      <span class="crumb" aria-current="page">Packet parser</span>
    </nav>
  </header>

  <main class="stage">
    <section class="panel">
      <h3>Packet parser</h3>
      <p class="hint">Turns a <code>.docx</code> packet, or a <code>.zip</code> of them, into JSON.
        Nothing is stored.</p>

      <label class="select-label" for="yapp-file">Packet file</label>
      <input type="file" id="yapp-file" accept=".docx,.zip,application/zip" />
      <p class="hint" id="yapp-file-note"></p>
    </section>

    <section class="panel">
      <h3>Output</h3>
      <label class="select-label" for="yapp-format">Format</label>
      <select id="yapp-format">
        <option value="json">JSON</option>
        <option value="yapp2">yapp2 JSON (with guide anchors)</option>
        <option value="html">HTML (to read on screen)</option>
        <option value="tiebreakers">Tiebreakers (one JSON per tossup)</option>
      </select>
      <p class="hint" id="yapp-format-note"></p>
      <label class="toggle"><input type="checkbox" id="yapp-pretty" checked /> Pretty-print</label>
      <label class="toggle" id="yapp-merge-row"><input type="checkbox" id="yapp-merge" /> Merge the zip
        into one file</label>
    </section>

    <section class="panel">
      <div class="row">
        <button id="yapp-parse" class="primary" disabled>Parse packet</button>
        <span class="hint" id="yapp-status"></span>
      </div>
      <p id="yapp-msg" class="msg"></p>

      <!-- Per-file failures from a zip: the rest of the set still converted. -->
      <div id="yapp-errors" class="roster-alerts hidden">
        <h5>Packets that didn't parse <span id="yapp-errors-count" class="muted-count"></span></h5>
        <ul id="yapp-errors-list"></ul>
      </div>
    </section>

    <!-- What the checks found. Sits above the result so a packet that lost a
         question is read before the Download button is clicked. -->
    <section class="panel hidden" id="yapp-checks-panel">
      <h3>Checks <span id="yapp-checks-meta" class="muted-count"></span></h3>
      <p class="hint">Problems the parser didn't catch.</p>
      <div id="yapp-checks"></div>
    </section>

    <section class="panel hidden" id="yapp-result-panel">
      <h3>Result <span id="yapp-result-meta" class="muted-count"></span></h3>
      <div class="row">
        <button id="yapp-download" class="primary">Download</button>
        <button id="yapp-copy" class="ghost">Copy</button>
      </div>
      <p class="hint" id="yapp-preview-note"></p>
      <pre id="yapp-preview" class="yapp-preview"></pre>
    </section>
  </main>

  <script type="module" src="/js/yapp.js"></script>
</body>
</html>
